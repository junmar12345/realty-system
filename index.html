<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REALTY SYSTEM - MULTI-TENANT ENTERPRISE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
    <div id="loginSubscriptionBanner" class="login-subscription-alert hidden"></div>

    <div class="login-box">
        <div id="loginLogoPreview" class="login-logo">🏢</div>
        <h1 id="loginSystemNameDisplay">REALTY SYSTEM</h1>
        <p>SECURE EXECUTIVE &amp; STAFF PORTAL</p>

        <div class="form-group">
            <label>USERNAME OR REALTY NAME</label>
            <input id="loginUsername" type="text" placeholder="Enter username or realty name" autocomplete="username" onkeydown="if(event.key==='Enter') login()">
        </div>

        <div class="form-group">
            <label>PASSWORD / TEMPORARY PASSWORD</label>
            <input id="loginPassword" type="password" placeholder="Enter permanent or temporary password" autocomplete="current-password" onkeydown="if(event.key==='Enter') login()">
        </div>

        <button class="btn btn-primary full" onclick="login()">🔐 LOGIN</button>

        <div class="login-demo"></div>
    </div>
</div>

<!-- APP WRAPPER -->
<div id="app" class="app hidden">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div id="sideLogoWrap" class="sidebar-brand-logo">🏢</div>
            <div>
                <div id="sideSystemName" class="sidebar-brand-name">REALTY SYSTEM</div>
            </div>
        </div>

        <div class="user-box">
            <strong id="sideUser">USER</strong><br>
            <small id="sideRole">ROLE</small><br>
            <span id="sideBranchBadge" class="branch-indicator-badge">MAIN BRANCH</span>
        </div>

        <!-- DYNAMIC SIDEBAR MENU ITEMS (Dito pumapasok ang buttons ayon sa role) -->
        <div id="sidebarNavItems"></div>

        <div style="margin-top:20px; padding-top:10px; border-top:1px solid #1f2937;">
            <button class="nav-btn" onclick="logout()">🚪 Logout</button>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <div class="page-title">
                <h2 id="pageTitle">Dashboard</h2>
                <p id="pageSubtitle">Realty Management Overview</p>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <!-- UNIVERSAL TOPBAR BRANCH SWITCHER -->
                <div id="topbarBranchSwitcher" class="hidden" style="display:flex; align-items:center; gap:6px; background:#fff; padding:5px 10px; border-radius:10px; border:1px solid #cbd5e1;">
                    <span style="font-size:12px; font-weight:800; color:#475569;">👁️ VIEW ROOM:</span>
                    <select id="topbarBranchSelect" style="border:0; outline:none; font-weight:bold; color:#2563eb; font-size:13px; background:transparent; cursor:pointer;" onchange="universalSwitchBranch(this.value)">
                    </select>
                </div>

                <button class="btn-refresh" onclick="refreshCurrentRoom()" title="Refresh this page">
                    🔄 Refresh Room
                </button>
                <span id="topRole" class="badge badge-blue"></span>
            </div>
        </div>

        <div id="content" class="content"></div>
    </main>
</div>

<!-- MODAL POPUP -->
<div id="modal" class="modal hidden">
    <div class="modal-box">
        <div id="modalContent"></div>
    </div>
</div>

<!-- MODULAR JAVASCRIPT FILES -->
<script src="core.js"></script>
<script src="realty.js"></script>
<script src="boss.js"></script>
<script src="it.js"></script>

</body>
</html>
